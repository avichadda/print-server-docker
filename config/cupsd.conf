LogLevel warn
PageLogFormat
MaxLogSize 10m

Listen 0.0.0.0:631
Listen /run/cups/cups.sock

Browsing On
BrowseLocalProtocols dnssd
DefaultAuthType Basic
DefaultEncryption IfRequested
WebInterface Yes
ServerAlias *

PreserveJobHistory Yes
PreserveJobFiles No

<Location />
  Order deny,allow
  Allow @LOCAL
</Location>

<Location /admin>
  AuthType Default
  Require user @SYSTEM
  Order deny,allow
  Allow localhost
</Location>

<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order deny,allow
  Allow localhost
</Location>

<Location /admin/log>
  AuthType Default
  Require user @SYSTEM
  Order deny,allow
  Allow localhost
</Location>

<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  <Limit Create-Job Print-Job Print-URI Validate-Job Send-Document Send-URI Close-Job Cancel-Jobs Cancel-My-Jobs>
    Order deny,allow
    Allow @LOCAL
  </Limit>

  <Limit Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job CUPS-Move-Job CUPS-Get-Document>
    Require user @OWNER @SYSTEM
    Order deny,allow
    Allow @LOCAL
  </Limit>

  <Limit Cancel-Job>
    Require user @OWNER @SYSTEM
    Order deny,allow
    Allow @LOCAL
  </Limit>

  <Limit Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications>
    Require user @OWNER @SYSTEM
    Order deny,allow
    Allow @LOCAL
  </Limit>

  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
    Allow localhost
  </Limit>

  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
    Allow localhost
  </Limit>

  <Limit CUPS-Authenticate-Job>
    Require user @OWNER @SYSTEM
    Order deny,allow
    Allow @LOCAL
  </Limit>

  <Limit All>
    Order deny,allow
    Allow @LOCAL
  </Limit>
</Policy>
